# MetalSoft dual-media boot menu
#
# This ISO (virtual media 1, volume label CIDATA) only carries the boot loader and
# the autoinstall files. The stock Ubuntu installer ISO is mounted unmodified on
# virtual media 2. Boot the installer's kernel from that drive with our own
# parameters: "autoinstall" makes subiquity run without asking for confirmation,
# and cloud-init finds user-data/meta-data on this ISO by its CIDATA label.
set timeout=2

set menu_color_normal=white/black
set menu_color_highlight=black/light-gray

# The installer is the drive with casper's UUID marker; this ISO does not have one.
search --no-floppy --set=installer --file /.disk/casper-uuid-generic

menuentry "Install Ubuntu Server" {
	set gfxpayload=keep
	linux	($installer)/casper/vmlinuz quiet fsck.mode=skip intel_iommu=on iommu=pt autoinstall network-config=disabled ---
	initrd	($installer)/casper/initrd
}
