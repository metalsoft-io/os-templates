template:
  name: Ubuntu 24.04.3 LTS PowerFlex SDC
  label: ubuntu-24-04-3-lts-powerflex-sdc
  description: Ubuntu 24.04.3 LTS with PowerFlex SDC 5.1.200.112
  visibility: private
  device:
    architecture: x86_64
    bootmode: uefi
    type: server
  imagebuild:
    required: true
  install:
    drivetype: local_drive
    method: oob
    readymethod: wait_for_power_off
  os:
    name: Ubuntu
    version: 24.04.3
    credential:
      username: ubuntu
      passwordtype: generated
  tags:
    - ubuntu
    - powerflex
