### ESXi 9.1 general-purpose installation script
# Unlike the VCF cluster-node template this does not depend on a logical network name: the management
# interface is the one carrying the default gateway (else the first one with an IPv4 address), tagged
# (vlan interface on a physical or bond parent) or untagged (physical or bond interface).
# Redundancy on the connection (the platform sends a `bond`) -> every bond member is a vSwitch0 uplink; no bond -> only
# the management interface's own NIC is used and other NICs stay off vSwitch0.

## Accept the VMware End User License Agreement
vmaccepteula

# Set the root password (no fallback: the platform always supplies initial credentials for servers)
rootpw {{ serverInstance.osCredentials.initialPasswordEncrypted }}

# Clear partitions and install
clearpart --alldrives --overwritevmfs
install --overwritevmfs --firstdisk

{#- Pick the management interface and its physical uplinks (lists built with push).
    Redundancy on the connection -> the platform sends a `bond` interface: both members become vSwitch0 uplinks.
    No bond -> only the management interface's own NIC is used; any other NIC (and its IP) is left unconnected. #}
{%- set withIp = [] %}
{%- set withGw = [] %}
{%- set physical = [] %}
{%- set bonds = [] %}
{%- if network and network.interfaces %}
{%- for interface in network.interfaces %}
{%- if interface.interfaceType == 'physical' %}
    {%- set physical = (physical.push(interface), physical) %}
{%- elif interface.interfaceType == 'bond' %}
    {%- set bonds = (bonds.push(interface), bonds) %}
{%- endif %}
{%- if interface.ipv4Addresses and interface.ipv4Addresses | length and interface.ipv4Addresses[0].ip %}
    {%- set withIp = (withIp.push(interface), withIp) %}
    {%- if interface.ipv4Addresses[0].isDefaultGateway %}
        {%- set withGw = (withGw.push(interface), withGw) %}
    {%- endif %}
{%- endif %}
{%- endfor %}
{%- endif %}
{%- set mgmt = withGw[0] if withGw | length else withIp[0] %}
{%- set uplinks = [] %}
{%- set bondMode = '' %}
{%- if mgmt %}
{%- set onParent = mgmt.interfaceType == 'vlan' and mgmt.links and mgmt.links | length %}
{%- set parentType = mgmt.links[0].interfaceType if onParent else mgmt.interfaceType %}
{%- set parentId = mgmt.links[0].id if onParent else mgmt.typeInterfaceId %}
{%- set parentBond = [] %}
{%- if parentType == 'bond' %}
{%- for b in bonds %}
    {%- if b.typeInterfaceId == parentId %}{% set parentBond = (parentBond.push(b), parentBond) %}{% endif %}
{%- endfor %}
{%- endif %}
{%- if parentBond | length %}
{%- for m in parentBond[0].members %}
    {%- for p in physical %}
        {%- if p.typeInterfaceId == m.id %}{% set uplinks = (uplinks.push(p), uplinks) %}{% endif %}
    {%- endfor %}
{%- endfor %}
{%- set bondMode = parentBond[0].bondMode or (parentBond[0].parameters.mode if parentBond[0].parameters else '') or '' %}
{%- elif parentType == 'physical' %}
{%- for p in physical %}
    {%- if p.typeInterfaceId == parentId %}{% set uplinks = (uplinks.push(p), uplinks) %}{% endif %}
{%- endfor %}
{%- endif %}
{%- set addr = mgmt.ipv4Addresses[0] %}
{%- set gateway = addr.gateway or (mgmt.routes[0].via if mgmt.routes and mgmt.routes | length else '') %}
{%- set vlanId = mgmt.vlanId if mgmt.interfaceType == 'vlan' else 0 %}
{%- endif %}
{%- set fqdn = serverInstance.fqdn or (serverInstance.label + '.' + siteConfig.dnsZoneName if siteConfig.dnsZoneName else serverInstance.label) %}
{%- set dnsServers = (siteConfig.DNSServers or []) | select %}
{%- set ntpServers = (siteConfig.NTPServers or []) | select %}

# Set the network
{%- if mgmt and uplinks | length %}
network --bootproto=static --device={{ uplinks[0].macAddress }} --ip={{ addr.ip }} --netmask={{ addr.netmask }}{% if gateway %} --gateway={{ gateway }}{% endif %}{% if vlanId %} --vlanid={{ vlanId }}{% endif %}{% if dnsServers | length %} --nameserver={{ dnsServers | join(',') }}{% endif %} --hostname={{ fqdn }}
{%- else %}
network --bootproto=dhcp --hostname={{ fqdn }}
{%- endif %}

## Reboot ESXi Host
reboot

%firstboot --interpreter=busybox

sleep 2
# enable & start SSH (readyMethod wait_for_ssh)
vim-cmd hostsvc/enable_ssh
vim-cmd hostsvc/start_ssh

# enable & start ESXi Shell
vim-cmd hostsvc/enable_esx_shell
vim-cmd hostsvc/start_esx_shell

# Suppress ESXi Shell warning
esxcli system settings advanced set -o /UserVars/SuppressShellWarning -i 1

# Disable CEIP
esxcli system settings advanced set -o /UserVars/HostClientCEIPOptIn -i 2

esxcli system hostname set --fqdn {{ fqdn }}

{%- if serverInstance.customVariables and serverInstance.customVariables.pub_ssh_key %}
/bin/echo -e '{{ serverInstance.customVariables.pub_ssh_key }}' > /etc/ssh/keys-root/authorized_keys
{%- elif managementSSHKey %}
/bin/echo -e '{{ managementSSHKey }}' > /etc/ssh/keys-root/authorized_keys
{%- endif %}

{%- if mgmt and uplinks | length > 1 %}

getInterfaceNameFromMAC() {
    esxcli network nic list | grep -i "$1" | awk '{print $1}'
}

{%- if bondMode == '802.3ad' %}
# LACP bond: a standard vSwitch has no LACP, and the switch pair's LACP fallback forwards on only ONE member of the
# port-channel and may pick any of them. Keep only the first member up so the switch must pick it; the others are
# link-down and off vSwitch0 until vCenter moves the host to a distributed switch with an LACP LAG.
# Best effort only: on i40en (X710) `nic down` drops the link in ESXi but the switch still sees the port up, so the
# fallback can still move to a downed member. Use server-only-bond (active-backup) for ESXi.
{%- for u in uplinks %}{% if not loop.first %}
nic="$(getInterfaceNameFromMAC "{{ u.macAddress }}")"
[ -n "$nic" ] && esxcli network nic down -n "$nic"
{%- endif %}{% endfor %}
{%- else %}
# Switch-independent bond: every member becomes a vSwitch0 uplink (the installer only adds --device).
# active-backup -> first member active, the rest standby; balance-xor -> IP hash (static LAG); otherwise all
# active, route by originating port ID.
nics=""
{%- for u in uplinks %}
nic="$(getInterfaceNameFromMAC "{{ u.macAddress }}")"
if [ -n "$nic" ]; then
    esxcli network vswitch standard uplink add --uplink-name "$nic" --vswitch-name vSwitch0 2>/dev/null
    nics="${nics:+$nics,}$nic"
fi
{%- endfor %}
first="${nics%%,*}"
rest="${nics#*,}"
[ "$rest" = "$nics" ] && rest=""
{%- if bondMode == 'active-backup' %}
[ -n "$rest" ] && esxcli network vswitch standard policy failover set --vswitch-name vSwitch0 --load-balancing portid --active-uplinks "$first" --standby-uplinks "$rest"
{%- elif bondMode == 'balance-xor' %}
[ -n "$rest" ] && esxcli network vswitch standard policy failover set --vswitch-name vSwitch0 --load-balancing iphash --active-uplinks "$nics"
{%- else %}
[ -n "$rest" ] && esxcli network vswitch standard policy failover set --vswitch-name vSwitch0 --load-balancing portid --active-uplinks "$nics"
{%- endif %}
{%- endif %}
{%- endif %}
{%- if mgmt and vlanId %}

# VMs on the default port group (e.g. a vCenter appliance) land on the management VLAN
esxcli network vswitch standard portgroup set -p "VM Network" -v {{ vlanId }}
{%- endif %}

# DNS
esxcli network ip dns server remove --all
{%- for s in dnsServers %}
esxcli network ip dns server add --server="{{ s }}"
{%- endfor %}
{%- if siteConfig.dnsZoneName %}
esxcli network ip dns search add --domain="{{ siteConfig.dnsZoneName }}"
{%- endif %}

{%- if ntpServers | length %}

# NTP
esxcli system ntp set{% for s in ntpServers %} --server="{{ s }}"{% endfor %} --enabled=true
esxcli network firewall ruleset set -e true -r ntpClient
{%- endif %}

# The host certificate was issued at install time for "localhost"; reissue it for the real FQDN so
# vCenter and other clients can verify the host.
/sbin/generate-certificates
/etc/init.d/hostd restart
/etc/init.d/rhttpproxy restart

%post --interpreter=python --ignorefailure=true
import time
stampFile = open('/finished.stamp', mode='w')
stampFile.write( time.asctime() )
