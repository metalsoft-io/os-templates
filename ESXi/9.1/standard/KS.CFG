### ESXi 9.1 general-purpose installation script
# Unlike the VCF cluster-node template this does not depend on a logical network name: the management
# interface is the one carrying the default gateway (else the first one with an IPv4 address), tagged
# (vlan interface on a physical parent) or untagged (physical interface).

## Accept the VMware End User License Agreement
vmaccepteula

# Set the root password (no fallback: the platform always supplies initial credentials for servers)
rootpw {{ serverInstance.osCredentials.initialPasswordEncrypted }}

# Clear partitions and install
clearpart --alldrives --overwritevmfs
install --overwritevmfs --firstdisk

{#- Pick the management interface and its physical uplinks (lists built with push). #}
{%- set withIp = [] %}
{%- set withGw = [] %}
{%- set physical = [] %}
{%- if network and network.interfaces %}
{%- for interface in network.interfaces %}
{%- if interface.interfaceType == 'physical' %}
    {%- set physical = (physical.push(interface), physical) %}
{%- endif %}
{%- if interface.ipv4Addresses and interface.ipv4Addresses | length and interface.ipv4Addresses[0].ip %}
    {%- set withIp = (withIp.push(interface), withIp) %}
    {%- if interface.ipv4Addresses[0].isDefaultGateway %}
        {%- set withGw = (withGw.push(interface), withGw) %}
    {%- endif %}
{%- endif %}
{%- endfor %}
{%- endif %}
{%- set mgmt = withGw[0] if withGw | length else withIp[0] %}
{%- set parents = [] %}
{%- set uplinks = [] %}
{%- if mgmt %}
{%- set parentId = mgmt.links[0].id if (mgmt.interfaceType == 'vlan' and mgmt.links and mgmt.links | length) else mgmt.typeInterfaceId %}
{%- for p in physical %}
    {%- if p.typeInterfaceId == parentId %}{% set parents = (parents.push(p), parents) %}{% endif %}
    {%- if p.logicalNetworkId == mgmt.logicalNetworkId %}{% set uplinks = (uplinks.push(p), uplinks) %}{% endif %}
{%- endfor %}
{%- set addr = mgmt.ipv4Addresses[0] %}
{%- set gateway = addr.gateway or (mgmt.routes[0].via if mgmt.routes and mgmt.routes | length else '') %}
{%- set vlanId = mgmt.vlanId if mgmt.interfaceType == 'vlan' else 0 %}
{%- endif %}
{%- set fqdn = serverInstance.fqdn or (serverInstance.label + '.' + siteConfig.dnsZoneName if siteConfig.dnsZoneName else serverInstance.label) %}
{%- set dnsServers = (siteConfig.DNSServers or []) | select %}
{%- set ntpServers = (siteConfig.NTPServers or []) | select %}

# Set the network
{%- if mgmt and parents | length %}
network --bootproto=static --device={{ parents[0].macAddress }} --ip={{ addr.ip }} --netmask={{ addr.netmask }}{% if gateway %} --gateway={{ gateway }}{% endif %}{% if vlanId %} --vlanid={{ vlanId }}{% endif %}{% if dnsServers | length %} --nameserver={{ dnsServers | join(',') }}{% endif %} --hostname={{ fqdn }}
{%- else %}
network --bootproto=dhcp --hostname={{ fqdn }}
{%- endif %}

## Reboot ESXi Host
reboot

%firstboot --interpreter=busybox

sleep 2
# enable & start SSH (readyMethod wait_for_ssh)
vim-cmd hostsvc/enable_ssh
vim-cmd hostsvc/start_ssh

# enable & start ESXi Shell
vim-cmd hostsvc/enable_esx_shell
vim-cmd hostsvc/start_esx_shell

# Suppress ESXi Shell warning
esxcli system settings advanced set -o /UserVars/SuppressShellWarning -i 1

# Disable CEIP
esxcli system settings advanced set -o /UserVars/HostClientCEIPOptIn -i 2

esxcli system hostname set --fqdn {{ fqdn }}

{%- if serverInstance.customVariables and serverInstance.customVariables.pub_ssh_key %}
/bin/echo -e '{{ serverInstance.customVariables.pub_ssh_key }}' > /etc/ssh/keys-root/authorized_keys
{%- elif managementSSHKey %}
/bin/echo -e '{{ managementSSHKey }}' > /etc/ssh/keys-root/authorized_keys
{%- endif %}

{%- if mgmt and uplinks | length %}

getInterfaceNameFromMAC() {
    esxcli network nic list | grep -i "$1" | awk '{print $1}'
}

# Uplinks: every physical NIC on the management network, all active (the installer only adds --device)
active=""
{%- for u in uplinks %}
nic="$(getInterfaceNameFromMAC "{{ u.macAddress }}")"
if [ -n "$nic" ]; then
    esxcli network vswitch standard uplink add --uplink-name "$nic" --vswitch-name vSwitch0 2>/dev/null
    active="${active:+$active,}$nic"
fi
{%- endfor %}
[ -n "$active" ] && esxcli network vswitch standard policy failover set --vswitch-name vSwitch0 --active-uplinks "$active"
{%- if vlanId %}

# VMs on the default port group (e.g. a vCenter appliance) land on the management VLAN
esxcli network vswitch standard portgroup set -p "VM Network" -v {{ vlanId }}
{%- endif %}
{%- endif %}

# DNS
esxcli network ip dns server remove --all
{%- for s in dnsServers %}
esxcli network ip dns server add --server="{{ s }}"
{%- endfor %}
{%- if siteConfig.dnsZoneName %}
esxcli network ip dns search add --domain="{{ siteConfig.dnsZoneName }}"
{%- endif %}

{%- if ntpServers | length %}

# NTP
esxcli system ntp set{% for s in ntpServers %} --server="{{ s }}"{% endfor %} --enabled=true
esxcli network firewall ruleset set -e true -r ntpClient
{%- endif %}

# The host certificate was issued at install time for "localhost"; reissue it for the real FQDN so
# vCenter and other clients can verify the host.
/sbin/generate-certificates
/etc/init.d/hostd restart
/etc/init.d/rhttpproxy restart

%post --interpreter=python --ignorefailure=true
import time
stampFile = open('/finished.stamp', mode='w')
stampFile.write( time.asctime() )
