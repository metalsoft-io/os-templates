{#-
  Nutanix Community Edition 2.1 - unattended install (Phoenix "Arizona" mode).

  Replaces /EFI/BOOT/grub.cfg of the stock CE ISO. Identical to the stock entry except for the
  installer network arguments and AZ_CONF_URL, which carries the per-node answer file inline as a
  URL-encoded data: URL (phoenix reads it with Python urlopen, which supports data: URLs). This keeps
  the per-node configuration inside the per-instance ISO the platform builds - no web server, no DHCP.

  The answer file has no '=' (urlencode) and no spaces, as required by phoenix's cmdline parser, and no
  \ ' or " (urlencode + replace): GRUB's grub_create_loader_cmdline() prefixes each of those with a
  backslash when it builds the kernel cmdline, which breaks the JSON ("Invalid \escape").
  The installer downloads the AOS package and AHV ISO over HTTP(S) from the URLs below, using the
  static installer IP passed as PHOENIX_IP/MASK/GATEWAY (the host IP of the node).
  The CVM IP is deliberately NOT set here (the platform does not know it at install time); the
  extension assigns it after install over the host's internal 192.168.5.x link. CE's ce_validate()
  calls len() on all six host/CVM network fields, so the CVM ones are sent as "" (= not set).
-#}
{%- set aosVersion = '6.8.1' %}
{#- Phoenix requires {url, md5sum} objects here: _check_required_params calls .get("url") on
    hypervisor_iso_url, and the md5sum makes the installer verify both downloads. #}
{%- set aos = { "url": "https://repo.metalsoft.io/.nutanix/ce-2.1/nutanix_installer_package.tar", "md5sum": "c2cf84ceae79b9aef945bbb5386f790f" } %}
{%- set ahv = { "url": "https://repo.metalsoft.io/.nutanix/ce-2.1/AHV-DVD-x86_64-el8.nutanix.20230302.101026.iso.iso", "md5sum": "d83f73ac1f444ddba3825d335daf908a" } %}

{#- Management interface: the one carrying the default gateway, else the first with an IPv4 address. #}
{%- set withIp = [] %}
{%- set withGw = [] %}
{%- if network and network.interfaces %}
{%- for interface in network.interfaces %}
{%- if interface.ipv4Addresses and interface.ipv4Addresses | length and interface.ipv4Addresses[0].ip %}
    {%- set withIp = (withIp.push(interface), withIp) %}
    {%- if interface.ipv4Addresses[0].isDefaultGateway %}
        {%- set withGw = (withGw.push(interface), withGw) %}
    {%- endif %}
{%- endif %}
{%- endfor %}
{%- endif %}
{%- set mgmt = withGw[0] if withGw | length else withIp[0] %}
{#- AHV bond uplinks: only the physical NICs MetalSoft wired to the management network. Without this,
    CE's firstboot (kvm_net_utils.configure_ovs) bonds every NIC and active-backup may pick an unused
    port. Uplinks match by MAC (lowercase) in get_vswitch_links(). #}
{%- set uplinkMacs = [] %}
{%- for interface in network.interfaces %}
{%- if interface.interfaceType == 'physical' and interface.logicalNetworkId == mgmt.logicalNetworkId and interface.macAddress %}
    {%- set uplinkMacs = (uplinkMacs.push(interface.macAddress | lower), uplinkMacs) %}
{%- endif %}
{%- endfor %}
{%- set addr = mgmt.ipv4Addresses[0] %}
{%- set gateway = addr.gateway or (mgmt.routes[0].via if mgmt.routes and mgmt.routes | length else '') %}
{%- set dnsServers = (siteConfig.DNSServers or []) | select %}

{#- Disk roles (kernel device names): server instance / instance group customVariables override the
    defaults. Extension instance-array customVariables do NOT reach this context (Ansible extra-vars only),
    so set ce_* customVariables on the instance group to change them. Never leave the AHV disk to the
    installer's auto-pick: with equal-size disks it may choose a CVM disk. #}
{%- set cvi = serverInstance.customVariables or {} %}
{%- set cvg = (serverInstanceGroup.customVariables if serverInstanceGroup else {}) or {} %}
{%- set hypDisk = cvi.ce_hyp_boot_disk or cvg.ce_hyp_boot_disk or 'sda' %}
{%- set cvmBootDisks = (cvi.ce_cvm_boot_disks or cvg.ce_cvm_boot_disks or 'sdb') | string %}
{%- set cvmDataDisks = (cvi.ce_cvm_data_disks or cvg.ce_cvm_data_disks or 'sdc') | string %}

{#- Phoenix only creates the host UEFI "Nutanix AHV" boot entry on layouts it recognises (Dell/iLO/Intel),
    not for CE's generic layout - so after imaging the server reboots into the still-attached virtual CD
    and reinstalls in a loop. The post_phoenix hook runs right before that reboot: it drops stale
    "Nutanix AHV" entries (left by earlier passes; enough of them and the firmware stops honouring the new
    entry's position), creates the entry for the AHV disk first in BootOrder and sets BootNext.
    The script is too long for the kernel cmdline, so it ships in this ISO (template asset /post_phoenix.sh)
    and the hook only mounts the installer ISO - found the same way phoenix's images.mount_iso does (blkid label PHOENIX), still attached as
    virtual media at this point - and runs it. #}
{%- set postPhoenixHook = "mkdir -p /tmp/msiso;mount -o ro $(blkid|grep 'LABEL=\"PHOENIX\"'|cut -d: -f1|head -1) /tmp/msiso&&bash /tmp/msiso/post_phoenix.sh;umount /tmp/msiso" %}
{%- set az = {
  "hyp_type": "kvm",
  "node_position": "A",
  "block_id": serverInstance.label,
  "hypervisor_hostname": serverInstance.label,
  "svm_version": aosVersion,
  "nos_version": aosVersion,
  "host_ip": addr.ip,
  "host_subnet_mask": addr.netmask,
  "default_gw": gateway,
  "svm_ip": "",
  "svm_subnet_mask": "",
  "svm_default_gw": "",
  "dns_ip": dnsServers[0] if dnsServers | length else '',
  "ce_hyp_boot_disk": hypDisk,
  "ce_cvm_boot_disks": cvmBootDisks.split(','),
  "ce_cvm_data_disks": cvmDataDisks.split(','),
  "ce_eula_accepted": true,
  "ce_eula_viewed": true,
  "svm_installer_url": aos,
  "hypervisor_iso_url": ahv,
  "vswitches": [ { "name": "br0", "uplinks": uplinkMacs, "bond-mode": "active-backup" } ],
  "hook_scripts": { "post_phoenix": "data:," + (postPhoenixHook | urlencode) }
} %}
set default=0

insmod part_gpt
insmod part_msdos

set timeout=1

search --no-floppy --set=root -l 'PHOENIX'

menuentry 'CEInstaller' {
	linuxefi /boot/kernel init=/ce_installer intel_iommu=on iommu=pt kvm-intel.nested=1 kvm.ignore_msrs=1 kvm-intel.ept=1 vga=791 net.ifnames=0 PHOENIX_IP={{ addr.ip }} MASK={{ addr.netmask }} GATEWAY={{ gateway }}{% if dnsServers | length %} NAMESERVER={{ dnsServers | join(',') }}{% endif %} "AZ_CONF_URL=data:,{{ az | dump | urlencode | replace("'", "%27") | safe }}" IMG=squashfs
        initrdefi /boot/initrd
}
